  deploy:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: "0.152.2"

      - name: Build
        run: hugo

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          external_repository: mosuke5-lab/mosuke5-lab.github.io
          publish_branch: main
          publish_dir: ./public
          personal_token: ${{ secrets.DEPLOY_TOKEN }}
          cname: blog.mosuke.tech

      - name: Wait for GitHub Pages deploy
        run: bash ./scripts/wait_for_pages_deploy.sh "${{ secrets.DEPLOY_TOKEN }}"

      - name: Purge cloudflare cache
        run: |
          bash ./scripts/delete_page_cache.sh ${{secrets.CF_ZONE_ID}} ${{secrets.CF_EMAIL}} ${{secrets.CF_KEY}}
